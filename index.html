<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta property="og:site_name" content="ALGC Profile | Web Native">
    <meta property="og:title" content="ALGC Profile | Web Native">
    <meta property="og:description" content="ALGC Company Profile | Babul Web Native PDF Viewer">
    <meta property="og:image" content="https://algc.vercel.app/live.jpg">
    <meta content="ALGC Company Profile | Babul Web Native PDF Viewer" name="description">
    <meta content="algc, company, profile, web, native, babul, pdf, viewer" name="keywords">
    <link href="./assets/img/algc.png" rel="icon">
    <link href="assets/img/algc.png" rel="apple-touch-icon">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>ALGC Profile | Babul PDF Viewer</title>
</head>

<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" role="status" aria-label="Loading PDF viewer">

        <!-- Keep logo.png in the same folder as this HTML file -->
        <img src="./assets/img/logo.svg" alt="Babul Logo" class="loading-logo">

        <div class="loader" aria-hidden="true"></div>

        <p class="loading-text">Loading</p>
    </div>


    <!-- DESKTOP PDF VIEWER -->
    <div id="desktop-pdf-container">
        <embed id="desktop-embed" type="application/pdf">
    </div>


    <!-- MOBILE PDF.JS VIEWER -->
    <div id="mobile-pdf-container">
        <iframe id="mobile-iframe" title="PDF Document Viewer" allowfullscreen>
        </iframe>
    </div>


    <!-- FLOATING CREATOR FOOTER -->
    <footer id="creator-footer">
        <a href="https://devbabul.vercel.app" target="_blank"><p>Made with ❤️ by Babul Khan</p></a>
    </footer>


    <script src="./assets/js/script.js"></script>

</body>

</html>
